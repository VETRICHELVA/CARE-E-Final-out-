[project]
name = "iot-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "paho-mqtt>=2,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.uv]
package = false

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
