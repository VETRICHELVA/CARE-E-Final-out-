name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [hub-api, ai-service, iot-ingest]
    # Same host ports as infra/docker-compose.yml, so test defaults work unchanged.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: care
          POSTGRES_PASSWORD: care
          POSTGRES_DB: care
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U care -d care"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  client-drift:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder - S03 regenerates packages/api-client and fails on drift."
